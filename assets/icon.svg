<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    cuse のアプリアイコン（原画）。右手で指揮棒を振る Clawd。
    Clawd は画面の指揮役の AA（src/shared/characters.ts の getLeaderFrame、ふだんの形）を、そのまま点に直したもの
    （端末の文字のセルは縦長なので、点は 1:2 の縦長にする）。指揮棒だけはアイコンでは長く描く。音符の色は AA の色（--ink-*）。
    書き換えたら npm run icon で assets/icon.icns と assets/icon.png を作り直す。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262d"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
  </defs>
  <!-- macOS のアイコンの余白（824 四方の角丸） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#3a3f48" stroke-width="3"/>

  <!-- 音符 -->
  <g fill="#f5b544"><rect x="560" y="296" width="54" height="36"/><rect x="569" y="287" width="36" height="54"/><rect x="596" y="170" width="18" height="135"/><rect x="614" y="188" width="18" height="18"/><rect x="632" y="206" width="18" height="45"/></g>
  <g fill="#4cc9f0"><rect x="700" y="369" width="66" height="44"/><rect x="711" y="358" width="44" height="66"/><rect x="744" y="215" width="22" height="165"/><rect x="766" y="237" width="22" height="22"/><rect x="788" y="259" width="22" height="55"/></g>

  <!-- 指揮棒（上げた右手から左上へ） -->
  <g fill="#f2f3f5"><rect x="244" y="520" width="20" height="28"/><rect x="230" y="492" width="20" height="28"/><rect x="216" y="464" width="20" height="28"/><rect x="202" y="436" width="20" height="28"/><rect x="188" y="408" width="20" height="28"/><rect x="174" y="380" width="20" height="28"/><rect x="160" y="352" width="20" height="28"/><rect x="146" y="324" width="20" height="28"/></g>

