<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    cuse のアプリアイコン（原画）。指揮役（上の橙）が線で配下（下の 3 つ）を束ねる形。
    画面の AA と同じく、角ばった点の絵にする。色は styles.css の --accent と AA の色（--ink-*）。
    書き換えたら npm run icon で assets/icon.icns と assets/icon.png を作り直す。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262d"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
  </defs>
  <!-- macOS のアイコンの余白（824 四方の角丸） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#3a3f48" stroke-width="3"/>

  <!-- 絵は上下の余白がそろうよう少し下げる -->
  <g transform="translate(0 12)">
  <!-- 線（指揮役から配下へ） -->
  <g fill="#5b636e">
    <rect x="500" y="440" width="24" height="96"/>
    <rect x="272" y="536" width="480" height="24"/>
    <rect x="272" y="536" width="24" height="88"/>
    <rect x="500" y="536" width="24" height="88"/>
    <rect x="728" y="536" width="24" height="88"/>
  </g>

  <!-- 指揮役 -->
  <rect x="384" y="248" width="256" height="192" fill="#d97757"/>
  <rect x="352" y="296" width="32" height="96" fill="#d97757"/>
  <rect x="640" y="296" width="32" height="96" fill="#d97757"/>
  <rect x="448" y="304" width="32" height="56" fill="#0e1014"/>
  <rect x="544" y="304" width="32" height="56" fill="#0e1014"/>

  <!-- 配下 -->
  <rect x="220" y="624" width="128" height="128" fill="#4cc9f0"/>
  <rect x="448" y="624" width="128" height="128" fill="#5fd38d"/>
  <rect x="676" y="624" width="128" height="128" fill="#f5b544"/>
  <g fill="#0e1014">
    <rect x="252" y="664" width="20" height="36"/>
    <rect x="296" y="664" width="20" height="36"/>
    <rect x="480" y="664" width="20" height="36"/>
    <rect x="524" y="664" width="20" height="36"/>
    <rect x="708" y="664" width="20" height="36"/>
    <rect x="752" y="664" width="20" height="36"/>
  </g>
  </g>
</svg>
