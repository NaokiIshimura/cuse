name: release

# PR が main にマージされた（= main への push）タイミングで配布物を作り、
# package.json の version に対応するリリースがまだ無ければ Releases に公開する。
# 配布物は 2 種類: CLI の npm パッケージ（.tgz）と、macOS 用の .app（zip）。
# （cc-park の release.yml を元に、CLI の .tgz を足したもの）
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 同時に走らせるとタグの作成が競合するため、直列に流す
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # .app のビルドと codesign には macOS ランナーが要る
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: バージョンとタグを決める
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "value=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: 同じバージョンのリリースが既にあるか調べる
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 型チェックとテスト
        run: |
          npm run typecheck
          npm test

      - name: CLI の npm パッケージを作る
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p artifacts
          npm run build
          npm pack --pack-destination artifacts
          # README の手順は releases/latest/download/ から取るので、名前にバージョンを含まない複製も添える
          cp "artifacts/cuse-${VERSION}.tgz" artifacts/cuse.tgz

      - name: .app をビルドして zip にまとめる
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for arch in arm64 x64; do
            # ad-hoc での署名し直しと検証は postgui:package が行う
            npm run gui:package -- --arch="${arch}"
            # .app はディレクトリなので、シンボリックリンクと権限を保てる ditto で固める
            ditto -c -k --sequesterRsrc --keepParent \
              "release/cuse-darwin-${arch}/cuse.app" \
              "artifacts/cuse-${VERSION}-darwin-${arch}.zip"
            cp "artifacts/cuse-${VERSION}-darwin-${arch}.zip" "artifacts/cuse-darwin-${arch}.zip"
          done

      # リリースを作らない場合でも、ビルド結果は実行ログから取れるようにしておく
      - uses: actions/upload-artifact@v4
        with:
          name: cuse-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.tgz
            artifacts/*.zip
          retention-days: 14

      - name: リリースノートを書く
        if: steps.published.outputs.value == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## ダウンロード

          | ファイル | 中身 |
          | --- | --- |
          | `cuse-VERSION.tgz` / `cuse.tgz` | CLI（`cuse status` / `agents` / `output` / `app`）の npm パッケージ |
          | `cuse-VERSION-darwin-arm64.zip` / `cuse-darwin-arm64.zip` | ウィンドウの `.app`（Apple シリコン、M1 以降） |
          | `cuse-VERSION-darwin-x64.zip` / `cuse-darwin-x64.zip` | ウィンドウの `.app`（Intel Mac） |

          Node.js 20 以上と、Claude Code v2.1.139 以降（`claude` コマンドが PATH にあること）が必要です。

          ## CLI をインストールする

          ```bash
          npm install -g https://github.com/NaokiIshimura/cuse/releases/download/vVERSION/cuse-VERSION.tgz
          ```

          `cuse app` でウィンドウも開けます（Electron は npm の依存として一緒に入ります）。
          アンインストールは `npm uninstall -g cuse` です。

          ## .app をインストールする（macOS）

          配布用の証明書で署名・公証をしていないため、ブラウザでダウンロードすると初回は Gatekeeper に止められます。
          ターミナルで次のコマンドを実行すると、ダウンロードして `/Applications` に置けます（古い `cuse.app` は置き換えます）。

          Apple シリコン（M1 以降）:

          ```bash
          curl -fL -o /tmp/cuse.zip https://github.com/NaokiIshimura/cuse/releases/download/vVERSION/cuse-VERSION-darwin-arm64.zip && \
            rm -rf /Applications/cuse.app && \
            ditto -x -k /tmp/cuse.zip /Applications && \
            rm /tmp/cuse.zip
          ```

          Intel Mac:

          ```bash
          curl -fL -o /tmp/cuse.zip https://github.com/NaokiIshimura/cuse/releases/download/vVERSION/cuse-VERSION-darwin-x64.zip && \
            rm -rf /Applications/cuse.app && \
            ditto -x -k /tmp/cuse.zip /Applications && \
            rm /tmp/cuse.zip
          ```

          `curl` でダウンロードしたファイルには隔離属性（`com.apple.quarantine`）が付かないため、Gatekeeper に止められません。

          ブラウザでダウンロードした場合は、zip を展開して `cuse.app` を `/Applications` に置き、
          次のコマンドで隔離属性を外してください。

          ```bash
          xattr -dr com.apple.quarantine /Applications/cuse.app
          ```

          ## 動作確認

          `claude --bg --name <名前> "<指示>"` で background セッションを 2〜3 個動かしてから、次を実行します。
          台帳（`~/.cuse/ledger.json`）は第 2 段階から書かれるので、いまは `--all` を付けて全セッションを見ます。

          ```bash
          cuse agents --all
          ```

          ```bash
          cuse status --all
          ```

          ```bash
          cuse output <名前>
          ```

          ウィンドウ（`cuse app` か `cuse.app`）では、左上の「全セッション」に切り替えて一覧を見ます。
          NOTES
          sed -i '' "s/VERSION/${VERSION}/g" release-notes.md

      - name: リリースを公開する
        if: steps.published.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" artifacts/*.tgz artifacts/*.zip \
            --title "cuse ${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}"

      - name: リリース済みなので公開はしない
        if: steps.published.outputs.value == 'true'
        run: |
          echo "::notice::${{ steps.version.outputs.tag }} は公開済みです。新しく配布するには package.json の version を上げてください。"
